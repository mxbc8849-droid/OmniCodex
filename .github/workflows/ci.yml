name: OmniCodex CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint GitHub Actions and YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go for actionlint
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Run actionlint
        run: "$(go env GOPATH)/bin/actionlint -ignore 'SC[0-9]+' .github/workflows/ci.yml"
      - name: Install yamllint
        run: python -m pip install --disable-pip-version-check yamllint
      - name: Run yamllint
        run: yamllint -d relaxed .github docker-compose.yml

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: omnicodex
          POSTGRES_USER: omnicodex
          POSTGRES_PASSWORD: omnicodex
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U omnicodex -d omnicodex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://omnicodex:omnicodex@127.0.0.1:5432/omnicodex
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET: ci-only-secret
      SSH_KNOWN_HOSTS: /tmp/known_hosts
    steps:
      - uses: actions/checkout@v4
      - name: Cache PostgreSQL and Redis service images
        id: service-images-cache
        uses: actions/cache@v4
        with:
          path: /tmp/omnicodex-service-images
          key: service-images-postgres16-redis7-${{ runner.os }}
      - name: Restore service images
        run: |
          mkdir -p /tmp/omnicodex-service-images
          if [ -f /tmp/omnicodex-service-images/postgres.tar ]; then docker load -i /tmp/omnicodex-service-images/postgres.tar; else docker pull postgres:16-alpine; docker save postgres:16-alpine -o /tmp/omnicodex-service-images/postgres.tar; fi
          if [ -f /tmp/omnicodex-service-images/redis.tar ]; then docker load -i /tmp/omnicodex-service-images/redis.tar; else docker pull redis:7-alpine; docker save redis:7-alpine -o /tmp/omnicodex-service-images/redis.tar; fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Prepare CI SSH trust file
        run: touch /tmp/known_hosts
      - name: Check Alembic migrations
        working-directory: backend
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Run backend tests
        run: |
          mkdir -p test-results
          python -m pytest backend/tests -q --junitxml=test-results/backend.xml
      - name: Publish backend results to Job Summary
        if: always()
        run: |
          echo "## Backend CI" >> "$GITHUB_STEP_SUMMARY"
          echo "- Alembic upgrade/check/downgrade: completed" >> "$GITHUB_STEP_SUMMARY"
          if grep -q 'failures="0" errors="0"' test-results/backend.xml; then echo '- pytest: ✅ passed' >> "$GITHUB_STEP_SUMMARY"; else echo '- pytest: ❌ failed' >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pytest-report
          path: test-results/backend.xml
          if-no-files-found: warn

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Cache Docker build layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: docker-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            docker-build-${{ runner.os }}-
      - name: Validate Compose configuration
        run: docker compose config
      - name: Build API image
        run: |
          docker buildx build --load -t omnicodex-api:ci --cache-from type=local,src=/tmp/.buildx-cache --cache-to type=local,dest=/tmp/.buildx-cache-new ./backend
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
      - name: Start full Compose stack
        env:
          JWT_SECRET: ci-compose-secret
        run: docker compose up -d --no-build
      - name: Wait for API health
        shell: bash
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color api postgres redis
          exit 1
      - name: Compose smoke tests
        run: |
          curl --fail --silent http://127.0.0.1:8000/health
          curl --fail --silent -X POST http://127.0.0.1:8000/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-password-123"}' > compose-auth.json
          test -s compose-auth.json
      - name: Run backup and restore drill
        env:
          OMNICODEX_ROOT: ${{ github.workspace }}
          OMNICODEX_BACKUP_ROOT: ${{ runner.temp }}/omnicodex-backups
        run: |
          chmod +x ops/backup.sh ops/restore-drill.sh
          mkdir -p "$OMNICODEX_BACKUP_ROOT"
          ./ops/backup.sh
          ./ops/restore-drill.sh
      - name: Capture Compose logs
        if: always()
        run: docker compose logs --no-color > compose-logs.txt
      - name: Upload Compose diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-diagnostics
          path: |
            compose-*.json
            compose-logs.txt
          if-no-files-found: ignore
      - name: Stop Compose stack
        if: always()
        run: docker compose down -v --remove-orphans
      - name: Publish Compose results to Job Summary
        if: always()
        run: |
          echo "## Docker Compose CI" >> "$GITHUB_STEP_SUMMARY"
          if test -s compose-auth.json; then echo '- API health and registration smoke test: ✅ passed' >> "$GITHUB_STEP_SUMMARY"; else echo '- API health and registration smoke test: ❌ failed' >> "$GITHUB_STEP_SUMMARY"; fi
          echo "### Service logs" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 80 compose-logs.txt 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
