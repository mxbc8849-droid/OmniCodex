name: OmniCodex Client Builds
on:
  workflow_dispatch:
  push:
    paths: ['client/**']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.24.5', channel: stable}
      - name: Install Windows build tools
        shell: powershell
        run: |
          choco install cmake ninja --no-progress -y
          refreshenv
      - run: flutter config --enable-windows-desktop
      - uses: microsoft/setup-msbuild@v2
      - name: Check Windows toolchain
        run: |
          flutter doctor -v
          cmake --version
          ninja --version
      - run: flutter create . --platforms=windows
        working-directory: client
      - run: flutter pub get
        working-directory: client
      - uses: ilammy/msvc-dev-cmd@v1
      - run: flutter build windows --release --dart-define=OMNI_API_BASE_URL=https://www.udn4f.com
        working-directory: client
      - uses: actions/upload-artifact@v4
        with: {name: omnicodex-windows, path: client/build/windows/x64/runner/Release}
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.24.5', channel: stable}
      - run: flutter create . --platforms=web
        working-directory: client
      - run: flutter pub get
        working-directory: client
      - run: flutter build web --release --dart-define=OMNI_API_BASE_URL=https://www.udn4f.com
        working-directory: client
      - uses: actions/upload-artifact@v4
        with: {name: omnicodex-web, path: client/build/web}
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.24.5', channel: stable}
      - run: flutter create . --platforms=ios
        working-directory: client
      - run: flutter pub get
        working-directory: client
      - run: flutter build ios --release --no-codesign --dart-define=OMNI_API_BASE_URL=https://www.udn4f.com
        working-directory: client
      - uses: actions/upload-artifact@v4
        with: {name: omnicodex-ios-unsigned, path: client/build/ios/iphoneos}
