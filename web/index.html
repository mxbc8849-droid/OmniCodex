<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>OmniCodex</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#0f172a;color:#e5e7eb}main{max-width:1100px;margin:auto;padding:24px}.card{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:20px;margin:14px 0}h1{font-size:30px}input,button,textarea{width:100%;padding:12px;border-radius:9px;border:1px solid #475569;background:#0f172a;color:#fff;margin:6px 0}button{background:#2563eb;border:0;cursor:pointer;font-weight:600}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.muted{color:#94a3b8}.ok{color:#4ade80}.log{height:180px;overflow:auto;background:#020617;padding:12px;border-radius:8px;white-space:pre-wrap}@media(max-width:700px){.grid{grid-template-columns:1fr}main{padding:14px}}</style></head><body><main><h1>OmniCodex</h1><p class="muted">云端 AI 智能运维控制台</p><section id="login" class="card"><h2>登录</h2><input id="email" type="email" placeholder="邮箱"><input id="password" type="password" placeholder="密码"><button onclick="login()">登录</button><p id="msg" class="muted"></p></section><section id="app" hidden><div class="grid"><div class="card"><h2>项目同步</h2><button onclick="sync()">立即同步</button><div id="projects" class="muted">尚未同步</div></div><div class="card"><h2>服务器状态</h2><p id="health">检查中…</p><button onclick="health()">刷新状态</button></div></div><div class="card"><h2>实时消息</h2><div id="log" class="log"></div></div></section></main><script>let token='';const api='';function out(x){document.getElementById('log').textContent+=new Date().toLocaleTimeString()+' '+(typeof x==='string'?x:JSON.stringify(x))+'\n'}async function login(){let f=new URLSearchParams({username:email.value,password:password.value});let r=await fetch('/v1/auth/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:f});let d=await r.json();if(!r.ok){msg.textContent=d.detail||'登录失败';return}token=d.access_token;localStorage.setItem('omni_token',token);login.hidden=true;app.hidden=false;health();sync();connect();out('登录成功')}async function health(){let d=await (await fetch('/health')).json();healthEl.textContent='API、PostgreSQL、Redis：正常';document.getElementById('health').textContent='API、PostgreSQL、Redis：正常'}async function sync(){let r=await fetch('/v1/sync/export',{headers:{Authorization:'Bearer '+token}});let d=await r.json();if(!r.ok){out(d);return}projects.textContent='项目数：'+d.manifest.projects.length;out('项目同步完成')}function connect(){let u=(location.protocol==='https:'?'wss://':'ws://')+location.host+'/v1/ws?token='+encodeURIComponent(token);let ws=new WebSocket(u);ws.onopen=()=>out('WebSocket 已连接');ws.onmessage=e=>out(JSON.parse(e.data));ws.onclose=()=>setTimeout(connect,3000)}let healthEl=document.getElementById('health');let saved=localStorage.getItem('omni_token');if(saved){token=saved;login.hidden=true;app.hidden=false;health();sync();connect()}</script></body></html>
