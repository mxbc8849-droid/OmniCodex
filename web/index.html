<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>OmniCodex Agent</title><style>*{box-sizing:border-box}body{margin:0;background:#0d1117;color:#e6edf3;font:15px system-ui,-apple-system,sans-serif}main{max-width:1200px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;padding:10px 4px 18px;border-bottom:1px solid #30363d;margin-bottom:12px}.top:before{content:"◈";color:#58a6ff;font-size:24px;margin-right:8px}.grid{display:grid;grid-template-columns:210px minmax(0,1fr) 300px;gap:12px}.side{min-height:520px}.side button{text-align:left;background:#21262d}.workspace{min-width:0}.card{background:#161b22;border:1px solid #30363d;border-radius:14px;padding:16px;margin:10px 0}h1{margin:0;font-size:22px;letter-spacing:-.3px;flex:1}h2{margin:4px 0 14px}input,textarea,button{width:100%;border-radius:9px;padding:11px;margin:5px 0;border:1px solid #30363d;background:#0d1117;color:#e6edf3}textarea{min-height:58px;resize:vertical;line-height:1.5}button{background:#238636;border:0;font-weight:600}button.secondary{background:#334155}.chat{height:calc(100vh - 300px);min-height:360px;overflow:auto;background:#0d1117;border-radius:10px;padding:12px}.msg{padding:9px 11px;margin:8px 0;border-radius:10px;white-space:pre-wrap}.user{background:#1f6feb;margin-left:12%}.agent{background:#21262d;margin-right:12%}.muted{color:#94a3b8}.log{height:160px;overflow:auto;white-space:pre-wrap;background:#0d1117;padding:10px;border-radius:9px}@media(max-width:900px){.grid{grid-template-columns:1fr}.side{min-height:auto}}@media(max-width:760px){.top{position:sticky;top:0;background:#0d1117;z-index:2}.grid{grid-template-columns:1fr}main{padding:10px}.chat{height:48vh}}</style></head><body><main><div class="top"><h1>OmniCodex Agent</h1><span id="status" class="muted">未登录</span></div><section id="login" class="card"><h2>登录</h2><input id="email" placeholder="邮箱"><input id="password" type="password" placeholder="密码"><button onclick="login()">登录并进入智能体</button><div id="err" class="muted"></div></section><section id="app" hidden><div class="grid"><aside class="card side"><h2>工作区</h2><p class="muted">OmniCodex</p><button onclick="checkHealth()">服务器状态</button><button onclick="sync()">项目同步</button><p class="muted">当前服务器</p><b>云端主控</b><p class="muted">实时连接</p><span style="color:#4ade80">● WebSocket</span></aside><div class="workspace"><div class="card"><h2>AI 对话</h2><div id="chat" class="chat"></div><textarea id="prompt" placeholder="例如：帮我检查服务器 Docker 状态，或部署 Nginx HTTPS"></textarea><button onclick="sendChat()">发送给 AI</button></div><div><div class="card"><h2>操作面板</h2><p class="muted">服务器与审批</p><div class="card"><h2>服务器</h2><div id="health">检查中…</div><button class="secondary" onclick="checkHealth()">刷新状态</button></div><div class="card"><h2>敏感操作审批</h2><input id="command" placeholder="例如 systemctl restart nginx"><button onclick="requestApproval()">申请执行</button><div id="approval" class="muted"></div></div><div class="card"><h2>实时执行日志</h2><div id="log" class="log"></div></div></div></div></section></main><script>let token='',ws;const $=id=>document.getElementById(id);function add(who,text){let d=document.createElement('div');d.className='msg '+who;d.textContent=text;$('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight}function log(x){$('log').textContent+=new Date().toLocaleTimeString()+' '+(typeof x==='string'?x:JSON.stringify(x))+'\n'}async function login(){let b=new URLSearchParams({username:$('email').value,password:$('password').value});let r=await fetch('/v1/auth/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:b});let d=await r.json();if(!r.ok){$('err').textContent=d.detail||'登录失败';return}token=d.access_token;localStorage.omni_token=token;$('login').hidden=true;$('app').hidden=false;$('status').textContent='已连接';add('agent','你好，我是 OmniCodex。你可以直接告诉我服务器任务，我会先分析并在需要时申请审批。');checkHealth();connect()}async function sendChat(){let p=$('prompt').value.trim();if(!p)return;add('user',p);$('prompt').value='';let r=await fetch('/v1/ai/chat',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({model:'deepseek/deepseek-chat',messages:[{role:'user',content:p}]})});let d=await r.json();add('agent',r.ok?(d.content||'AI 未返回内容'):('请求失败：'+JSON.stringify(d)))}async function checkHealth(){let d=await (await fetch('/health')).json();$('health').innerHTML='<span class="muted">API / PostgreSQL / Redis</span><br><b style="color:#4ade80">全部正常</b>';log('服务器健康检查：'+JSON.stringify(d))}async function requestApproval(){let c=$('command').value.trim();if(!c)return;let r=await fetch('/v1/approvals',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({command:c,ttl_seconds:300})});let d=await r.json();if(r.ok){$('approval').innerHTML='审批已创建：<b>'+d.id+'</b><br><button onclick="decide(\''+d.id+'\',\'approve\')">允许执行</button> <button class="secondary" onclick="decide(\''+d.id+'\',\'deny\')">拒绝</button>'}else $('approval').textContent=JSON.stringify(d)}async function decide(id,x){let r=await fetch('/v1/approvals/'+id+'/'+x,{method:'POST',headers:{Authorization:'Bearer '+token}});$('approval').textContent=JSON.stringify(await r.json())}function connect(){ws=new WebSocket('wss://'+location.host+'/v1/ws?token='+encodeURIComponent(token));ws.onopen=()=>log('WebSocket 实时连接已建立');ws.onmessage=e=>{let d=JSON.parse(e.data);log(d);if(d.type==='approval.pending')add('agent','检测到敏感操作，需要审批：'+d.command)}}let saved=localStorage.omni_token;if(saved){token=saved;$('login').hidden=true;$('app').hidden=false;$('status').textContent='已连接';checkHealth();connect()}</script></body></html>
