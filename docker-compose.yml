services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: {POSTGRES_DB: omnicodex, POSTGRES_USER: omnicodex, POSTGRES_PASSWORD: omnicodex}
    volumes: [omnicodex_pg:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U omnicodex"], interval: 5s, timeout: 5s, retries: 10}
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes: [omnicodex_redis:/data]
  api:
    build: ./backend
    image: omnicodex-api:ci
    restart: unless-stopped
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://omnicodex:omnicodex@postgres:5432/omnicodex
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-replace-this-secret}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      AGENT_SSH_KEY: /run/secrets/agent_id_ed25519
      AGENT_SSH_USER: root
      SSH_KNOWN_HOSTS: /run/secrets/agent_known_hosts
    secrets:
      - agent_id_ed25519
      - agent_known_hosts
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
volumes: {omnicodex_pg: {}, omnicodex_redis: {}}
secrets:
  agent_id_ed25519:
    file: ./secrets/agent_id_ed25519
  agent_known_hosts:
    file: ./secrets/known_hosts

