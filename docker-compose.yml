services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: omnicodex, POSTGRES_USER: omnicodex, POSTGRES_PASSWORD: omnicodex}
    volumes: [omnicodex_pg:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U omnicodex"], interval: 5s, timeout: 5s, retries: 10}
  redis:
    image: redis:7-alpine
    volumes: [omnicodex_redis:/data]
  api:
    build: ./backend
    image: omnicodex-api:ci
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://omnicodex:omnicodex@postgres:5432/omnicodex
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-replace-this-secret}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
volumes: {omnicodex_pg: {}, omnicodex_redis: {}}
